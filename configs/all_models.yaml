# configs/all_models.yaml
# Evaluation configuration for all models (LSTM + Transformer).
# Run with: python evaluate.py --config configs/all_models.yaml

threshold_methods:
  - mean_std
  - percentile95
  - percentile99

models:
  - lstm
  - transformer

n_bootstrap: 1000
ci_level: 0.95
random_seed: 42

output_dir: outputs/evaluation/all_models
semg_dir: outputs/sEMG
kinkin_dir: outputs/kinetics

movements:
  - WAK
  - UPS
  - DNS
  - HS
  - KLCL
  - KLFT
  - LLB
  - LLF
  - LLS
  - LUGB
  - LUGF
  - SITDN
  - STC
  - STDUP
  - TO
  - TPTO

test_subjects:
  - Sub36
  - Sub37
  - Sub38
  - Sub39
  - Sub40

severity_levels:
  - mild
  - moderate
  - severe

figure_formats:
  - png
  - pdf
  - svg

dry_run: false

# Semi-supervised training configuration for LSTM and Transformer models.
# NOTE: This block is currently documentation/reference only. 
# Actual training-time semi-supervised behavior is controlled via run_pipeline.py 
# CLI flags (--semi_supervised, --augmentation_fraction, --lambda_cls), not by this YAML block.
semi_supervised:
  enabled: true                  # Set to true to train/load with classifier head
  augmentation_fraction: 0.20    # Fraction of normal train windows replaced by synthetic anomalies
  lambda_cls: 0.5                # Weighting multiplier for the binary cross entropy loss
  augmentation_severity: moderate # Severity level of synthetic anomalies used for training
  use_classifier_labeling: false # Set to true to classify using probability > 0.5 instead of reconstruction thresholds

